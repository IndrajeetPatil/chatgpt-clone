name: Docker Build Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: v0.71.2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Check Docker Compose
        run: docker compose version

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSLO "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh"
          echo "e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a  install.sh" | sha256sum -c
          sudo sh install.sh -b /usr/local/bin "$TRIVY_VERSION"
          rm install.sh
          trivy --version

      - name: Create .env file
        # This job only smoke-tests that the containers build and start; it never
        # issues a chat request, so no real Azure credentials are needed. Using
        # dummy placeholders keeps secrets out of PR-controlled build/run steps.
        run: |
          echo AZURE_OPENAI_ENDPOINT=https://example.invalid/ >> backend/.env
          echo AZURE_OPENAI_API_KEY=dummy-key >> backend/.env
          echo AZURE_OPENAI_API_VERSION=2024-09-01-preview >> backend/.env

      - name: Build services
        run: |
          docker compose build --pull --no-cache

      - name: Scan built images with Trivy
        run: |
          set -euo pipefail

          docker compose config --images | while read -r image; do
            trivy image \
              --scanners vuln \
              --pkg-types os,library \
              --severity CRITICAL \
              --exit-code 1 \
              --no-progress \
              --ignorefile .trivyignore.yaml \
              "$image"
          done

      - name: Test services
        run: |
          docker compose up -d
          docker compose ps
          docker compose logs
          docker compose down
