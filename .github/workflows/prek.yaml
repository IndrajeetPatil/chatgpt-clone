name: prek

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs; retain warnings and errors.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"
  PREK_COLOR: always

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ls-lint
        run: bash scripts/install-ls-lint.sh

      # prek manages Python hook environments; ty's hook supplies its own uv.
      # The action caches those environments and forces coloured output.
      - name: Run pre-commit hooks
        uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          # Latest version covered by this action revision's SHA256 table.
          prek-version: "0.5.6"
          extra-args: --all-files --stage pre-commit
        env:
          # CI checks main too; this guard is for local commits only.
          SKIP: no-commit-to-branch
