minimum_prek_version = "0.4.5"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "1f1e8bf348ff38fc88619a38d3ca4d9c56abea49"  # frozen: v0.16.5
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "ty", name = "ty", entry = "uv check --quiet --preview-features=check-command --ty-version=0.0.73 --directory=backend --isolated", language = "system", pass_filenames = false, types_or = ["python", "pyi", "jupyter"] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "358bd98f7d9d33fefe5a148875d1d61e7e558f2d"  # frozen: v0.2.62
hooks = [
  { id = "rumdl" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "commitlint",
    name = "commitlint",
    language = "node",
    entry = "commitlint --config commitlint.config.mjs --edit",
    additional_dependencies = [
      "@commitlint/cli@21.0.2",
      "@commitlint/config-conventional@21.0.2",
    ],
    stages = ["commit-msg"],
  },
  {
    id = "checkov",
    name = "checkov security scan",
    language = "system",
    entry = "make security-scan",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "\\.snap$" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json", exclude = "^\\.vscode/" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
